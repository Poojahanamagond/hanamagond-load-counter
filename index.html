<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
        content="#1769aa">

    <meta name="description"
        content="Hanamagond Counting System">
        <link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" type="image/png">

    <title>Hanamagond</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 25px 10px 30px;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            color: #1769aa;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 15px;
            color: #666;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .menu-card {
            width: 100%;
            min-height: 150px;
            border: none;
            border-radius: 22px;
            background: white;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.10);
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 22px;
            text-align: left;
            transition: transform 0.15s ease,
                        box-shadow 0.15s ease;
        }

        .menu-card:active {
            transform: scale(0.97);
        }

        .sticker {
            width: 105px;
            height: 105px;
            border-radius: 20px;
            background: #f1f6fb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 62px;
            flex-shrink: 0;
            margin-right: 20px;
        }

        .menu-content {
            flex: 1;
        }

        .menu-title {
            font-size: 24px;
            font-weight: 800;
            color: #222;
            margin-bottom: 7px;
        }

        .menu-description {
            font-size: 14px;
            color: #777;
            line-height: 1.4;
        }

        .arrow {
            font-size: 28px;
            color: #1769aa;
            margin-left: 8px;
        }

        .owner .sticker {
            background: #fff5e8;
        }

        .tractor .sticker {
            background: #eef8ee;
        }

        .jcb .sticker {
            background: #fff9df;
        }

        footer {
            text-align: center;
            padding: 35px 0 20px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 380px) {

            .menu-card {
                min-height: 130px;
                padding: 16px;
            }

            .sticker {
                width: 85px;
                height: 85px;
                font-size: 50px;
                margin-right: 15px;
            }

            .menu-title {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <main class="app">

        <!-- HEADER -->

        <header class="header">

            <div class="logo">
                🚜 HANAMAGOND
            </div>

            <div class="subtitle">
                Counting System
            </div>

        </header>


        <!-- MAIN MENU -->

        <section class="menu">

            <!-- OWNER -->

            <button
                class="menu-card owner"
                onclick="openOwner()">

                <div class="sticker">
                    👨‍🌾
                </div>

                <div class="menu-content">

                    <div class="menu-title">
                        Owner
                    </div>

                    <div class="menu-description">
                        Owner counting and reports
                    </div>

                </div>

                <div class="arrow">
                    ›
                </div>

            </button>


            <!-- TRACTOR -->

            <button
                class="menu-card tractor"
                onclick="openTractor()">

                <div class="sticker">
                    🚜
                </div>

                <div class="menu-content">

                    <div class="menu-title">
                        Tractor
                    </div>

                    <div class="menu-description">
                        Tractor load counting
                    </div>

                </div>

                <div class="arrow">
                    ›
                </div>

            </button>


            <!-- JCB -->

            <button
                class="menu-card jcb"
                onclick="openJCB()">

                <div class="sticker">
                    🏗
                </div>

                <div class="menu-content">

                    <div class="menu-title">
                        JCB
                    </div>

                    <div class="menu-description">
                        JCB counting and reports
                    </div>

                </div>

                <div class="arrow">
                    ›
                </div>

            </button>

        </section>


        <!-- FOOTER -->

        <footer>
            @2026 • HANAMAGOND
        </footer>

    </main>


    <script>

        function openOwner() {

            window.location.href =
                "login.html";

        }


        function openTractor() {

            /*
             * THIS OPENS YOUR EXISTING
             * TRACTOR APPLICATION.
             *
             * DO NOT CHANGE YOUR TRACTOR CODE.
             */

            window.location.href =
                "tractor.html";

        }


        function openJCB() {

            window.location.href =
                "jcb.html";

        }

    </script>
    <script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js")
            .then(function () {
                console.log("Service Worker registered successfully");
            })
            .catch(function (error) {
                console.error("Service Worker registration failed:", error);
            });
    });
}
</script>

</body>

</html>
